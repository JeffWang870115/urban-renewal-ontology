# 调研计划 Outline
# 主题：国内城市体检与城市更新概念梳理、政策演变趋势、技术标准/导则/政策文件收集
# 生成日期：2026-09-09
# 时间范围：2018 年至今
# 工作流：本文件由 /research 生成；下一步执行 /research-deep 启动深度调研

topic: 国内城市体检与城市更新概念梳理、政策演变趋势、技术标准·导则·政策文件收集
created: 2026-09-09
time_range: 2018年至今
source_framework: 模型知识初步框架(11项) + 后台检索补充(12项) 合并去重为 20 项
citation_rule: 遵照本项目 AGENTS.md 强约束——每条定义/指标/阈值必须标注 来源文件名+条款号·表号；无法给出写【待核】

# ===== 范围边界（2026-09-09 修订）=====
scope_boundaries:
  - 区分"自然资源口城市体检评估"(自然资源部/TD/T 1063-2021,"年度体检+五年评估")与"住建口城市体检"(住建部/8维→城区·街区·社区·小区四级)；两体系并列、口径不同，不得混淆
  - 本期(第一阶段)聚焦住建口城市体检与城市更新；自然资源口体检评估体系仅作边界区分，不列入深度调研主体
  - 既定排除项(项目规则)：房屋安全体检(单体建筑鉴定)、土地一级开发、房地产市场监管

items:
  # ---------- 概念类 ----------
  - id: 1
    name: 城市体检概念与定位
    category: 概念
    note: 2018年提出背景、住建部评估工作定位；须区分"房屋安全体检/房屋三项制度"与"城市体检"；并明确与"自然资源口城市体检评估"(TD/T 1063-2021)的体系边界
  - id: 2
    name: 城市更新概念与内涵
    category: 概念
    note: 上位概念；与老旧小区改造/城中村改造/老旧街区厂区提升的包含关系；与城市体检的联动关系
  - id: 3
    name: 城市体检指标体系
    category: 指标
    note: 指标体系经历重大调整——早期为8大维度(生态宜居/健康舒适/安全韧性/交通便捷/风貌特色/整洁有序/多元包容/创新活力)；后调整为城区/街区/社区/小区四级维度。须通过调研明确演进脉络与最新口径(如2026年55项基础指标 建办科〔2026〕16号)，并完善维度—指标映射
  # ---------- 政策演变类 ----------
  - id: 4
    name: 城市体检政策演变
    category: 政策
    note: 2018提出→2019试点(建科函〔2019〕78号)→全面开展(建科〔2023〕75号)→常态化时间线、历年工作方案
  - id: 5
    name: 城市更新政策演变
    category: 政策
    note: 棚改→城市更新行动(2020十四五)→试点(2021,21城)→写入政府工作报告(2023)→"十五五"规划(国发〔2026〕12号)
  - id: 6
    name: 防止大拆大建管控
    category: 政策
    note: 建科〔2021〕63号及配套、管控阈值、"留改拆"原则
  - id: 7
    name: 城市体检与城市更新一体化推进机制
    category: 政策
    note: "先体检、后更新，无体检、不更新"；以体检成果生成更新项目库(建科〔2023〕75号)
  - id: 10
    name: 城中村改造政策演变
    category: 政策
    note: 2023.7 国办《指导意见》→2024扩围(300+城/1790项目)→2025货币化安置(新增100万套+)
  # ---------- 子领域政策与标准 ----------
  - id: 8
    name: 完整社区建设政策与标准
    category: 技术
    note: 建科规〔2020〕7号(标准)+2021.12指南+2024.1嵌入式服务设施建设导则(发改委等三部门)+106个试点
  - id: 9
    name: 城镇老旧小区改造政策与技术体系
    category: 技术
    note: 国办发〔2020〕23号 + 各省技术导则(安徽/广东/宁夏/广西等2021-2023修订)
  - id: 11
    name: 房屋体检/养老金/保险"三项制度"
    category: 政策
    note: 2024起22城试点、2025扩围；须与城市体检"住房维度"概念区分
  # ---------- 技术文件（标准/导则/政策）----------
  - id: 12
    name: 国家标准(GB/T)
    category: 技术
    note: 住宅项目规范 GB 55038-2025(强制性,2025.5.1实施,废止GB 50368-2005等)；全国标准信息公共服务平台核验现行状态
  - id: 13
    name: 行业标准与团体标准
    category: 技术
    note: CJJ/JGJ/CECS 等(老旧小区改造、完整社区)；T/CACP 0001-2025《城市更新规划技术指南》(2025.11.20实施)；T/CAIEC 125-2025《城市有机更新项目设计与施工质量验收规范》
  - id: 14
    name: 技术导则
    category: 技术
    note: 城市体检评估技术导则(试行)；城市更新规划编制导则(建办科〔2025〕46号,2025.7.17,三级体系)；重庆/江西等地导则
  - id: 15
    name: 自然资源口配套政策
    category: 技术
    note: 自然资源部城市更新协同政策(归口非住建，属更新范畴支撑)；支持城市更新规划与土地政策指引(2023版,自然资办发〔2023〕47号)；进一步支持若干措施(自然资发〔2025〕226号)。本期聚焦住建口更新，此件作协同背景
  - id: 16
    name: 国土空间规划城市体检评估规程(自然资源口·边界区分)
    category: 边界区分
    note: TD/T 1063-2021(自然资源部)；"年度体检+五年评估"法定依据；与住建口城市体检体系并列、口径不同。本期聚焦住建口，此件仅作边界区分、不深挖
  # ---------- 地方与资金 ----------
  - id: 17
    name: 地方城市更新条例立法进展
    category: 技术
    note: 全国27部(省级/市级)；深圳(2020首部)/上海(2021)/北京(2022)/辽宁(2021首部省级)/天津(2025.11)/浙江城镇社区更新条例(2025.7)/江西(2025.11)/山西(2026.4)
  - id: 18
    name: 中央财政支持城市更新示范
    category: 政策
    note: 2024首批15城、2025第二批20城；资金规模与名单(财政部/住建部)
  # ---------- 综合 ----------
  - id: 19
    name: 城市更新"十五五"规划【已并入 #5，不单独成项】
    category: 政策
    note: 国发〔2026〕12号 内容已纳入 #5「城市更新政策演变」(2026-09-11 大王确认合并，避免重复)；本项不再单独调研
  - id: 20
    name: 现行有效文件总清单【最后一批·待执行】
    category: 综合
    note: 汇总全部标准/导则/政策的现行状态(有效/废止/试行/修订中)，形成可核对的文件树；基于已落盘 18 份 JSON 合成

execution:
  batch_size: 3          # 并行 agent 数（已确认）
  items_per_agent: 2     # 每 agent 调研项数（已确认）
  output_dir: ./城市体检与更新调研计划/results
  note: 20项 → 约10个agent、分4批；深度调研阶段遵守 citation_rule，来源须为官方/权威URL
