<!DOCTYPE html>
<html lang="zh-CN" data-theme="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市体检与更新本体 · 高保真原型 · 阶段一</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased}

/* ===== 语义域色体系（视觉规范 v1-20261011） ===== */
:root{
  --d-core:#185FA5;   --d-core-s:#E6F1FB;
  --d-metric:#534AB7; --d-metric-s:#EEEDFE;
  --d-axis:#0F6E56;   --d-axis-s:#E1F5EE;
  --d-space:#993C1D;  --d-space-s:#FAECE7;
  --d-renew:#3B6D11;  --d-renew-s:#EAF3DE;
  --d-policy:#854F0B; --d-policy-s:#FAEEDA;
  --d-neutral:#5F5E5A;--d-neutral-s:#F1EFE8;
}
html[data-theme="modern"]{
  --font:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --bg:#f6f6f3; --bg2:#f0f0ec;
  --panel:#ffffff; --panel2:#fafaf8; --panel3:#f2f2ee;
  --border:#e5e5df; --border2:#d6d6cf;
  --text:#1c1c1a; --text2:#6f6d66; --text3:#9b998f;
  --accent:#0f766e; --accent-soft:rgba(15,118,110,.10);
  --ok:#15803d; --warn:#a16207;
  --radius:14px; --radius-lg:20px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --head-h:62px; --foot-h:28px;
}

/* ===== 框架 ===== */
header{height:var(--head-h);display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand i{width:7px;height:7px;border-radius:2px;background:var(--d-core);display:inline-block}
.brand b{font-size:15px;font-weight:600;letter-spacing:.3px}
.brand span{font-size:10.5px;color:var(--text3);letter-spacing:.5px;
  font-family:"SFMono-Regular",Consolas,monospace}
.search{flex:1;max-width:360px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search input{width:100%;height:34px;padding:0 12px 0 33px;border-radius:8px;
  border:1px solid var(--border);background:var(--panel2);color:var(--text);
  font-family:var(--font);font-size:13px;outline:none;transition:.2s}
.search input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.views{margin-left:auto;display:flex;gap:4px;background:var(--panel3);padding:3px;border-radius:10px}
.vbtn{height:28px;padding:0 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;
  font-family:var(--font);font-size:12.5px;color:var(--text2);transition:.18s}
.vbtn:hover{color:var(--text)}
.vbtn.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{height:calc(100vh - var(--head-h) - var(--foot-h));display:grid;
  grid-template-columns:264px 1fr 344px;gap:12px;padding:12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.ph{padding:10px 14px;font-size:11px;letter-spacing:.8px;color:var(--text3);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
  text-transform:uppercase;font-weight:600;flex:none}
.ph em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;font-size:11px;margin-left:auto}
footer{height:var(--foot-h);display:flex;align-items:center;gap:12px;padding:0 20px;font-size:11px;
  color:var(--text3);border-top:1px solid var(--border);background:var(--panel)}
footer b{font-weight:600;color:var(--text2)}
footer .warn{color:var(--warn);cursor:pointer;text-decoration:underline dotted}
footer .right{margin-left:auto;font-family:"SFMono-Regular",Consolas,monospace}

/* ===== 类层级树 ===== */
.tree{flex:1;min-height:0;overflow:auto;padding:6px 6px 16px}
.tree::-webkit-scrollbar,.detail::-webkit-scrollbar{width:8px}
.tree::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.grp{font-size:10px;letter-spacing:.7px;font-weight:700;text-transform:uppercase;
  padding:12px 10px 5px;display:flex;align-items:center;gap:6px}
.grp i{width:3px;height:11px;border-radius:2px;background:var(--gc)}
.grp span{color:var(--text3)}
.item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;cursor:pointer;
  font-size:12.5px;color:var(--text2);transition:.15s;position:relative}
.item::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:2px;
  background:var(--nv,transparent);opacity:0;transition:.18s}
.item:hover{background:var(--panel3);color:var(--text)}
.item:hover::before{opacity:.45}
.item.sel{background:var(--nv-s);color:var(--nv);font-weight:600}
.item.sel::before{opacity:1}
.item .caret{width:11px;font-size:9px;color:var(--text3);transition:transform .2s;display:inline-block;flex:none}
.item.open .caret{transform:rotate(90deg)}
.item .cn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n{font-size:10px;padding:0 6px;border-radius:20px;background:var(--panel3);
  color:var(--text3);border:1px solid var(--border);font-family:"SFMono-Regular",Consolas,monospace}
.item.sel .n{background:#fff;border-color:var(--nv);color:var(--nv)}
.kids{display:none;padding-left:13px;margin-left:13px;border-left:1px dashed var(--border)}
.kids.show{display:block}

/* ===== 视图容器 ===== */
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:none}
.view.on{display:flex;flex-direction:column}

/* 图谱（深色画布 · 混合版） */
html[data-theme="modern"] .canvas{
  --edge:#4d6c8e; --text3:rgba(255,255,255,.55);
  --d-core:#5AA3E8;   --d-core-s:rgba(70,150,230,.46);
  --d-metric:#A79DF5; --d-metric-s:rgba(127,119,221,.46);
  --d-axis:#55D3A8;   --d-axis-s:rgba(29,158,117,.46);
  --d-space:#F58F66;  --d-space-s:rgba(216,90,48,.48);
  --d-renew:#A9D963;  --d-renew-s:rgba(99,153,34,.46);
  --d-policy:#F5BC55; --d-policy-s:rgba(239,159,39,.46);
  --d-neutral:#B3B1A7;--d-neutral-s:rgba(95,94,90,.46);
}
.canvas{flex:1;min-height:0;position:relative;
  background:radial-gradient(ellipse 82% 72% at 50% 38%,#17263a 0%,#101a2a 55%,#0b121e 100%)}
#graph{width:100%;height:100%;display:block;cursor:grab;--zk:1;--ss:1}
#graph:active{cursor:grabbing}
#world{transform-origin:0 0;will-change:transform;
  transition:transform .26s cubic-bezier(.22,.61,.36,1)}
#world.nofx{transition:none}
.edge{stroke:var(--edge);stroke-width:1.1;fill:none;vector-effect:non-scaling-stroke;
  transition:stroke .25s,opacity .25s,stroke-width .25s}
.edge.sub{opacity:.5}
.edge.core{stroke:var(--d-core);stroke-width:1.9;opacity:.95;
  filter:drop-shadow(0 0 3px rgba(90,163,232,.35))}
.edge.dash{stroke-dasharray:5 5;opacity:.5}
/* 对象属性边：青灰细虚线，区别于主干实线与继承灰边 */
.edge.prop{stroke:#6c8fa3;stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.edge.inst{stroke-width:.85;opacity:.4}
.edge.faded{opacity:.05}
.edge.hot{stroke:#fff;stroke-width:2.5;opacity:.98}
.elabel{font-size:calc(9.5px / var(--zk) / var(--ss));fill:#9fb2c4;pointer-events:none;opacity:.9;
  font-family:"SFMono-Regular",Consolas,monospace;text-anchor:middle;
  paint-order:stroke;stroke:rgba(9,15,24,.90);
  stroke-width:calc(2.6px / var(--zk) / var(--ss));stroke-linejoin:round}
.elabel[dy]{dominant-baseline:middle}
.elabel.core{fill:#cfe3f5;opacity:.95}
.elabel.prop{fill:#7fa0b3;opacity:.75;font-size:calc(8px / var(--zk) / var(--ss))}
/* 拖拽联动态：被拖节点与一跳邻居高亮 */
.gnode.dragging circle{stroke:#fff;stroke-width:3.6;
  filter:drop-shadow(0 0 12px rgba(255,255,255,.62))}
.gnode.pulled circle{stroke-width:2.8;filter:drop-shadow(0 0 7px rgba(255,255,255,.30))}
.gnode{cursor:pointer}
.gnode circle{stroke-width:1.8;vector-effect:non-scaling-stroke;
  transition:fill .28s,stroke .22s,stroke-width .22s,opacity .3s}
.gnode text{font-family:var(--font);text-anchor:middle;dominant-baseline:middle;
  pointer-events:none;font-weight:600}
/* 标签独立成层，永远画在所有节点之上（否则会被别的节点圆盖住） */
/* 圆内标签：白字、无描边、按圆半径自适应字号 */
.nlabel{font-family:var(--font);text-anchor:middle;dominant-baseline:central;
  pointer-events:none;font-weight:600;transition:opacity .22s;fill:#fff;
  font-size:calc(var(--lfs,12) * 1px)}   /* 纯随圆缩放，杜绝小圆文字溢出 */
.nlabel.top{font-weight:700}
.nlabel.inst{font-weight:500}
.gnode .en{font-size:8px;font-weight:400;font-family:"SFMono-Regular",Consolas,monospace;opacity:.8}
/* 全部节点统一实心圆：域色实心填充 + 白色居中文字 */
.gnode circle{stroke-width:1.4}
.gnode text{fill:#fff}
.gnode.g-core circle{fill:var(--d-core);stroke:var(--d-core)}
.gnode.g-metric circle{fill:var(--d-metric);stroke:var(--d-metric)}
.gnode.g-axis circle{fill:var(--d-axis);stroke:var(--d-axis)}
.gnode.g-space circle{fill:var(--d-space);stroke:var(--d-space)}
.gnode.g-renew circle{fill:var(--d-renew);stroke:var(--d-renew)}
.gnode.g-policy circle{fill:var(--d-policy);stroke:var(--d-policy)}
.gnode.g-neutral circle{fill:var(--d-neutral);stroke:var(--d-neutral)}
/* 待补声明类：仍实心，仅虚线描边标记语义 */
.gnode.undecl circle{stroke-dasharray:3 3;opacity:.85}
.gnode.undecl text{opacity:.9}
.gnode.inst circle{stroke-width:.9;opacity:.85}
.gnode:hover circle{stroke-width:2.6}
.gnode.dimmed,.gnode.miss{opacity:.10}
.gnode.faded{opacity:.10}
.gnode.hit circle{stroke-width:3.4;stroke:#E24B4A}
.gnode.spot circle{stroke-width:3.2;filter:drop-shadow(0 0 14px rgba(255,255,255,.45))}
/* 点击聚焦：原点与其邻居按距离依次「颤动一下」，形成涟漪感 */
.gnode.pop circle{transform-box:fill-box;transform-origin:center;
  animation:nodePop .62s cubic-bezier(.34,1.56,.64,1) both}
@keyframes nodePop{0%{transform:scale(1)}28%{transform:scale(1.42)}
  58%{transform:scale(.9)}100%{transform:scale(1)}}
.gnode.tech circle{stroke-dasharray:5 4}
.edge.inst{stroke-width:.7;opacity:.4}
.edge.faded{opacity:.05}
/* 画布上的控件 */
.hud{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;align-items:flex-end}
.legend{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:10px;padding:9px 11px;display:grid;grid-template-columns:auto auto;gap:4px 13px;
  font-size:10.5px;color:rgba(255,255,255,.78);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.legend .lg-t{grid-column:1/-1;font-size:9.5px;letter-spacing:.7px;color:rgba(255,255,255,.45);
  font-weight:600;text-transform:uppercase;margin-bottom:1px}
.legend .lg{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.crumb{position:absolute;left:14px;top:12px;font-size:11.5px;color:rgba(255,255,255,.62);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:8px;
  padding:5px 11px;font-family:"SFMono-Regular",Consolas,monospace}
.crumb b{color:#fff;font-weight:600}
/* 视角条已移除：四视角合并为单一视图（2026-11-22 大王示下） */
.ps small{font-family:"SFMono-Regular",Consolas,monospace;opacity:.6;margin-left:4px;font-size:9px}
/* 可交互图例：点域过滤 */
.legend .lg{cursor:pointer;border-radius:5px;padding:2px 4px;transition:opacity .2s,background .2s}
.legend .lg:hover{background:rgba(255,255,255,.10)}
.legend .lg.off{opacity:.32;text-decoration:line-through}
.legend .lg b{color:inherit;font-weight:600}
/* Neo4j 精修：节点投影 + 字号阶梯 + 主链焦点 */
#graph .gnode circle{filter:drop-shadow(0 2px 7px rgba(0,0,0,.62)) drop-shadow(0 0 6px rgba(255,255,255,.07))}
#graph .nlabel{font-weight:600}
#graph .nlabel.top{font-weight:700}
#graph .nlabel.inst{font-weight:500}
#graph .gnode.peer circle{stroke-width:2.6}
.tool{position:absolute;right:14px;top:12px;display:flex;gap:6px}
.tb{height:26px;padding:0 10px;border-radius:7px;cursor:pointer;font-size:11.5px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.72);
  font-family:var(--font);transition:.18s}
.tb:hover{background:rgba(255,255,255,.14);color:#fff}

/* 浅色视图容器（矩阵 / 闭环） */
.light{flex:1;min-height:0;overflow:auto;background:var(--panel)}

/* 双轴矩阵 */
.mx{padding:16px 18px 24px}
.mx table{border-collapse:separate;border-spacing:4px;width:100%}
.mx th{font-size:11px;color:var(--text3);font-weight:600;padding:4px 6px;text-align:center;white-space:nowrap}
.mx th.row{text-align:right;padding-right:10px}
.mx th.row i{display:inline-block;width:3px;height:11px;border-radius:2px;margin-right:7px;
  vertical-align:-1px;background:var(--gc)}
.mx td{text-align:center;height:34px;border-radius:8px;font-size:12.5px;font-weight:600;
  font-family:"SFMono-Regular",Consolas,monospace;cursor:pointer;transition:.15s;
  border:1px solid transparent}
.mx td.has{background:var(--cc-s);color:var(--cc);border-color:var(--cc)}
.mx td.has:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.mx td.zero{color:var(--text3);background:var(--panel3)}
.mx td.on{outline:2px solid var(--text);outline-offset:1px}

/* 主干闭环 */
.bb{padding:22px 20px 28px}
.bb-row{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px}
.bb-card{flex:1 1 auto;min-width:120px;border:1px solid var(--nc);border-radius:14px;padding:12px 13px;
  background:var(--nc-s);cursor:pointer;transition:.18s}
.bb-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.09)}
.bb-card h4{font-size:13px;font-weight:600;color:var(--nc);margin-bottom:3px;white-space:nowrap}
.bb-card .en{font-size:9.5px;font-family:"SFMono-Regular",Consolas,monospace;color:var(--text3);
  margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-card .kv{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;color:var(--text2)}
.bb-card .kv b{color:var(--nc);font-family:"SFMono-Regular",Consolas,monospace}
.bb-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:0 0 66px;min-width:66px;padding:0 4px;color:var(--text3)}
.bb-arrow .pr{font-size:9.5px;font-family:"SFMono-Regular",Consolas,monospace;
  color:var(--d-core);font-weight:600;text-align:center;line-height:1.25;word-break:keep-all}
.bb-arrow .cn{font-size:9.5px;margin-top:2px;white-space:nowrap}
.bb-arrow .line{width:100%;height:2px;background:var(--d-core);opacity:.55;margin-top:5px;position:relative}
.bb-arrow .line::after{content:'';position:absolute;right:0;top:-3px;border-left:7px solid var(--d-core);
  border-top:4px solid transparent;border-bottom:4px solid transparent}
.bb-dash{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text3)}
.bb-dash .seg{flex:1;border-top:2px dashed var(--border2)}
.bb-note{margin-top:20px;font-size:12px;line-height:1.8;color:var(--text2);
  border-left:3px solid var(--d-core);background:var(--d-core-s);padding:10px 14px;border-radius:0 8px 8px 0}

/* ===== 详情 ===== */
.detail{flex:1;min-height:0;overflow:auto;padding:0 16px 18px}
.d-bar{height:5px;margin:0 -16px 14px;background:var(--nv,var(--accent))}
.d-top{display:flex;align-items:flex-start;gap:10px}
.d-title{font-size:16.5px;font-weight:700;flex:1;letter-spacing:.2px}
.d-tag{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;
  background:var(--nv-s);color:var(--nv);border:1px solid var(--nv)}
.d-en{font-size:11px;color:var(--text3);font-family:"SFMono-Regular",Consolas,monospace;margin:4px 0 11px}
.d-uri{font-size:10px;font-family:"SFMono-Regular",Consolas,monospace;color:var(--nv);
  background:var(--nv-s);padding:6px 9px;border-radius:8px;word-break:break-all;line-height:1.5;
  margin-bottom:13px;border-left:3px solid var(--nv)}
.d-sec{font-size:10px;letter-spacing:.8px;color:var(--text3);font-weight:700;margin:15px 0 6px;
  text-transform:uppercase}
.d-text{font-size:12.5px;line-height:1.75;color:var(--text2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text2);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--text3);color:var(--text)}
.chip.static{cursor:default}
.chip.static:hover{border-color:var(--border);color:var(--text2)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:5px 10px;font-size:12px;line-height:1.6}
.kv dt{color:var(--text3)}
.kv dd{color:var(--text2);font-family:"SFMono-Regular",Consolas,monospace;word-break:break-all}
.plist{display:flex;flex-direction:column;gap:4px}
.prow{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 8px;border-radius:7px;
  background:var(--panel2);border:1px solid var(--border);cursor:pointer;transition:.15s}
.prow:hover{border-color:var(--text3)}
.prow .pn{flex:1;color:var(--text2)}
.prow .pid{font-size:10px;color:var(--text3);font-family:"SFMono-Regular",Consolas,monospace}
.prow .ty{font-size:9.5px;padding:1px 6px;border-radius:20px;background:var(--panel3);
  color:var(--text3);font-family:"SFMono-Regular",Consolas,monospace}
.empty{text-align:center;color:var(--text3);font-size:12px;margin-top:50px;line-height:2}
/* 指标行 */
.irow{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--border);font-size:12px;cursor:pointer}
.irow:hover{border-color:var(--d-metric)}
.irow .sq{font-family:"SFMono-Regular",Consolas,monospace;color:var(--d-metric);font-weight:700;
  font-size:11px;min-width:22px}
.irow .nm{flex:1;color:var(--text2);line-height:1.45}
/* ===== G3 智能诊断视图 ===== */
.dg{padding:18px 20px 26px;line-height:1.5}
.dg-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dg-head h3{font-size:15px;font-weight:600;color:var(--d-core)}
.dg-head p{font-size:11px;color:var(--text3)}
.dg-badge{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.dg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px;margin-bottom:18px}
.dg-card{border:1px solid var(--border);border-radius:12px;padding:11px 12px;background:var(--panel2);
  cursor:pointer;transition:.15s;border-left:3px solid var(--border2)}
.dg-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.dg-card.bad{border-left-color:#b91c1c;background:#fef4f4}
.dg-card.mid{border-left-color:var(--warn);background:#fffbeb}
.dg-card.good{border-left-color:var(--ok);background:#f4fbf6}
.dg-card .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dg-card .t b{font-size:12px;font-weight:600;color:var(--text)}
.dg-card .t em{font-style:normal;font-size:9.5px;color:var(--text3);font-family:"SFMono-Regular",Consolas,monospace}

</head>
<body>
<header>
  <div class="brand"><i></i><b>城市体检与更新本体</b><span>prototype · stage 1</span></div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="检索类 / 属性 / 指标，如 空间单元、computedFrom、燃气">
  </div>
  <div class="views">
    <button class="vbtn on" data-v="graph">知识图谱</button>
    <button class="vbtn" data-v="matrix">指标双轴</button>
    <button class="vbtn" data-v="backbone">主干闭环</button>
    <button class="vbtn" data-v="diagnosis">智能诊断</button>
  </div>
</header>

<main>
  <aside class="panel">
    <div class="ph">类层级 <em id="treeCount"></em></div>
    <div class="tree" id="tree"></div>
  </aside>

  <section class="panel">
    <div class="stage">
      <div class="view on" id="v-graph">
        <div class="canvas">
          <svg id="graph" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="crumb" id="crumb"></div>
          <div class="tool">
            <button class="tb" id="btnOverall">overall 总览</button>
            <button class="tb" id="btnABox">显示 ABox 个体</button>
            <button class="tb" id="btnZoomIn">＋</button>
            <button class="tb" id="btnZoomOut">－</button>
          </div>
          <div class="hud"><div class="legend" id="legend"></div></div>
        </div>
      </div>
      <div class="view" id="v-matrix"><div class="light"><div class="mx" id="mx"></div></div></div>
      <div class="view" id="v-backbone"><div class="light"><div class="bb" id="bb"></div></div></div>
      <div class="view" id="v-diagnosis"><div class="light dg" id="dg"></div></div>
    </div>
  </section>

  <aside class="panel">
    <div class="ph">详情</div>
    <div class="detail" id="detail"></div>
  </aside>
</main>

<footer>
  <span id="fStat"></span>
  <span id="fWarn"></span>
  <span class="right">城市体检与更新本体 · 阶段一原型</span>
</footer>

<script src="data/ontology.js"></script>
<script src="data/diagnosis.js"></script>
<script>
const D = window.__ONTOLOGY__;
window.onerror=function(m,s,l,c){ const el=document.getElementById('crumb');
  if(el) el.textContent='脚本错误：'+m+'  @'+l+':'+c; return false; };
if(!D){ document.body.innerHTML='<div style="padding:40px;font:14px sans-serif">数据未加载：请确认 data/ontology.js 存在（先运行 03-本体模型/_to_graph_json.py）</div>'; }

/* ===== 索引 ===== */
const CL = {};  D.classes.forEach(c=>CL[c.id]=c);
const PR = {};  D.properties.forEach(p=>PR[p.id]=p);
const TOP = D.classes.filter(c=>c.role==='top');
const SUPPORT = D.classes.filter(c=>c.role==='support'||c.role==='technical');
const UNDECL = D.classes.filter(c=>c.role==='undeclared');
const PROPS_BY_RANGE = {};
D.properties.forEach(p=>p.range.forEach(r=>{ (PROPS_BY_RANGE[r]=PROPS_BY_RANGE[r]||[]).push(p); }));
const DMAP = D.domainOf, DCN = D.domains;
const DOM_ORDER = ['core','metric','axis','space','renew','policy','neutral'];
/* 五级维度各占一域色（与视觉规范一致） */
const DIMCOL = {'HousingDimension':'core','ResidentialQuarterDimension':'metric',
  'CommunityDimension':'axis','NeighborhoodDimension':'renew','UrbanDistrictDimension':'space'};
function domOf(id){
  let c=CL[id];
  while(c){ if(c.domain) return c.domain; c = c.parent?CL[c.parent]:null; }
  return 'neutral';
}
/* 指标 ↔ 类 */
const IND_BY_CLASS = {};
D.indicators.forEach(i=>{
  const s=new Set();
  if(i.measures) s.add(i.measures);
  (i.computedFrom||[]).forEach(x=>s.add(x));
  s.forEach(k=>{ (IND_BY_CLASS[k]=IND_BY_CLASS[k]||[]).push(i); });
});
const instancesOf = id => D.individuals.filter(x=>x.cls===id);
const classByCn = {};
D.classes.forEach(c=>classByCn[c.cn]=c.id);

/* ===== 状态 ===== */
let state = { view:'graph', focus:'ExaminationActivity', sel:null };

/* ===== 视图切换 ===== */
document.querySelectorAll('.vbtn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); state.view=b.dataset.v;
    ['graph','matrix','backbone','diagnosis'].forEach(v=>
      document.getElementById('v-'+v).classList.toggle('on',v===state.view));
    if(state.view==='matrix') renderMatrix();
    if(state.view==='backbone') renderBackbone();
    if(state.view==='diagnosis') renderDiagnosis();
  };
});

/* ===== 左：类层级树 ===== */
const treeEl=document.getElementById('tree'); const itemEl={};
function treeItem(id, meta){
  const c=CL[id], dom=domOf(id), n=c.children.length||instancesOf(id).length||c.props.length||0;
  const el=document.createElement('div');
  el.className='item'+(c.children.length?'':' leaf');
  el.style.setProperty('--nv',`var(--d-${dom})`);
  el.style.setProperty('--nv-s',`var(--d-${dom}-s)`);
  el.dataset.id=id;
  el.innerHTML=`<span class="caret">▶</span><span class="cn">${c.cn}</span>`+
    (n?`<span class="n">${n}</span>`:'')+(c.declared===false?`<span class="n" title="ttl 未声明">!</span>`:'');
  return el;
}
function renderTree(){
  treeEl.innerHTML='';
  DOM_ORDER.concat(['__support__']).forEach(dom=>{
    const list = dom==='__support__'
      ? SUPPORT.concat(UNDECL)
      : TOP.filter(c=>c.domain===dom);
    if(!list.length) return;
    const g=document.createElement('div');
    g.className='grp';
    g.style.setProperty('--gc', dom==='__support__'?'var(--d-neutral)':`var(--d-${dom})`);
    g.innerHTML=`<i></i><span>${dom==='__support__'?'支撑类 / 待补声明':DCN[dom]}</span>`;
    treeEl.appendChild(g);
    list.forEach(c=>{
      const el=treeItem(c.id);
      itemEl[c.id]=el;
      const kids=document.createElement('div'); kids.className='kids';
      const pre = instancesOf(c.id);
      c.children.forEach(k=>{ const ke=treeItem(k); itemEl[k]=ke;
        ke.onclick=ev=>{ev.stopPropagation(); focusOn(k);};
        kids.appendChild(ke); });
      pre.slice(0,6).forEach(i=>{
        const k=document.createElement('div'); k.className='item leaf';
        k.style.setProperty('--nv',`var(--d-${dom})`); k.style.setProperty('--nv-s',`var(--d-${dom}-s)`);
        k.innerHTML=`<span class="caret">▶</span><span class="cn" style="color:var(--text3)">${i.cn}</span>`+
                    `<span class="n">个体</span>`;
        kids.appendChild(k);
      });
      if(pre.length>6){const m=document.createElement('div');m.className='item leaf';
        m.innerHTML=`<span class="caret">▶</span><span class="cn" style="color:var(--text3)">… 另有 ${pre.length-6} 个</span>`;
        kids.appendChild(m);}
      el.onclick=e=>{
        e.stopPropagation();
        kids.classList.toggle('show'); el.classList.toggle('open');
        focusOn(c.id);
      };
      treeEl.appendChild(el); treeEl.appendChild(kids);
    });
  });
  document.getElementById('treeCount').textContent =
    `${TOP.length} 顶层 · ${SUPPORT.length} 支撑 · ${UNDECL.length} 待补`;
}

/* ===== 选中 / 详情 ===== */
function focusOn(id, keepView){
  state.sel=id;
  Object.values(itemEl).forEach(e=>e.classList.remove('sel'));
  if(itemEl[id]) itemEl[id].classList.add('sel');
  if(state.view==='graph'){ state.focus=id; spotlight(id); }
  renderDetail(id);
}
function renderDetail(id){
  const c=CL[id]; if(!c) return;
  const dom=domOf(id), el=document.getElementById('detail');
  const inds = (IND_BY_CLASS[id]||[]).slice(0,14);
  const insts = instancesOf(id);
  const pIn  = c.props.map(p=>PR[p]).filter(Boolean);
  const pOut = (PROPS_BY_RANGE[id]||[]);
  const kids = c.children.map(k=>`<span class="chip" data-goto="${k}">${CL[k].cn}</span>`).join('');
  const props = arr => arr.length
    ? `<div class="plist">${arr.map(p=>`<div class="prow" data-prop="${p.id}">
         <span class="pn">${p.cn}</span>
         <span class="ty">${p.type==='object'?'对象':'数据'}</span>
         <span class="pid">${p.id}</span></div>`).join('')}</div>`
    : `<div class="d-text" style="color:var(--text3)">—</div>`;
  el.innerHTML=`
    <div class="d-bar" style="--nv:var(--d-${dom})"></div>
    <div class="d-top"><div class="d-title">${c.cn}</div>
      <span class="d-tag">${c.role==='top'?DCN[dom]:c.role==='undeclared'?'待补声明':c.role==='technical'?'技术构件':'支撑类'}</span></div>
    <div class="d-en">${c.en||c.id}</div>
    <div class="d-uri">${D.meta.namespace}${c.id}</div>
    ${c.desc?`<div class="d-sec">定义</div><div class="d-text">${c.desc}</div>`:''}
    ${c.source?`<div class="d-sec">来源</div><div class="d-text">${c.source}</div>`:''}
    ${c.role==='undeclared'?`<div class="d-sec">提示</div>
      <div class="d-text" style="color:var(--warn)">该类被 <code>rdfs:subClassOf</code> 引用，但 ttl 中未声明为 <code>owl:Class</code>。中文名取自 类与层级.md。</div>`:''}
    ${kids?`<div class="d-sec">下位类</div><div class="chips">${kids}</div>`:''}
    ${insts.length?`<div class="d-sec">实例（ABox）</div><div class="chips">${
      insts.slice(0,20).map(i=>`<span class="chip static">${i.cn}</span>`).join('')}${
      insts.length>20?`<span class="chip static">… 共 ${insts.length} 个</span>`:''}</div>`:''}
    ${inds.length?`<div class="d-sec">关联指标（${(IND_BY_CLASS[id]||[]).length}）</div>
      <div style="display:flex;flex-direction:column;gap:4px">${inds.map(i=>
        `<div class="irow" data-ind="${i.seq}"><span class="sq">#${i.seq}</span><span class="nm">${i.name}</span></div>`).join('')}
      </div>`:''}
    ${pIn.length?`<div class="d-sec">属性（以本类为定义域）</div>${props(pIn)}`:''}
    ${pOut.length?`<div class="d-sec">被引用（以本类为值域）</div>${props(pOut)}`:''}
    <div class="d-sec">标识</div>
    <dl class="kv"><dt>URI 名</dt><dd>${c.id}</dd><dt>所属域</dt><dd>${DCN[dom]}</dd>
      <dt>上位类</dt><dd>${c.parent?CL[c.parent].cn:'—（顶层）'}</dd>
      <dt>子类数</dt><dd>${c.children.length}</dd><dt>属性数</dt><dd>${c.props.length}</dd></dl>`;
  el.querySelectorAll('[data-goto]').forEach(x=>x.onclick=()=>focusOn(x.dataset.goto));
  el.querySelectorAll('[data-prop]').forEach(x=>x.onclick=()=>showProp(x.dataset.prop));
  el.querySelectorAll('[data-ind]').forEach(x=>x.onclick=()=>showIndicator(+x.dataset.ind));
}
function showProp(pid){
  const p=PR[pid], dom=domOf((p.domain[0])||p.range[0])||'neutral';
  const el=document.getElementById('detail');
  const ref=(arr,fmt)=>arr.map(a=>`<span class="chip" data-goto="${a}">${fmt(a)}</span>`).join('');
  el.innerHTML=`
    <div class="d-bar" style="--nv:var(--d-${dom})"></div>
    <div class="d-top"><div class="d-title">${p.cn}</div>
      <span class="d-tag">${p.type==='object'?'对象属性':'数据属性'}</span></div>
    <div class="d-en">${p.id}</div>
    <div class="d-uri">${D.meta.namespace}${p.id}</div>
    <div class="d-sec">定义域 domain</div><div class="chips">${p.domain.length?ref(p.domain,a=>CL[a]?CL[a].cn:a):'—'}</div>
    <div class="d-sec">值域 range</div><div class="chips">${p.range.length?ref(p.range,a=>CL[a]?CL[a].cn:(a.split('#').pop())):'—'}</div>`;
  el.querySelectorAll('[data-goto]').forEach(x=>x.onclick=()=>focusOn(x.dataset.goto));
}
function showIndicator(seq){
  const i=D.indicators.find(x=>x.seq===seq); if(!i) return;
  const dimCn=(D.dimensions.find(d=>d.id===i.dimension)||{}).cn||i.dimension;
  const el=document.getElementById('detail');
  el.innerHTML=`
    <div class="d-bar" style="--nv:var(--d-metric)"></div>
    <div class="d-top"><div class="d-title">#${i.seq} ${i.name}</div>
      <span class="d-tag" style="--nv:var(--d-metric);--nv-s:var(--d-metric-s)">体检指标</span></div>
    <div class="d-en">Indicator_${i.code}</div>
    <div class="d-uri" style="--nv:var(--d-metric);--nv-s:var(--d-metric-s)">${i.uri}</div>
    <dl class="kv">
      <dt>维度</dt><dd>${dimCn}</dd>
      <dt>分类</dt><dd>${i.category||'—（54/55 无分类）'}</dd>
      <dt>空间层级</dt><dd>${CL[i.measures]?CL[i.measures].cn:i.measures}</dd>
      <dt>计量单位</dt><dd>${i.unit||'—'}</dd>
      <dt>导向</dt><dd>${i.orientation}（${i.orientation==='正向'?'越高越好':'越低越好'}）</dd>
      <dt>状态</dt><dd>${i.status}</dd>
    </dl>
    <div class="d-sec">数据对象 computedFrom</div>
    <div class="chips">${i.computedFrom.map(o=>`<span class="chip" data-goto="${o}">${CL[o]?CL[o].cn:o}</span>`).join('')}</div>
    ${i.formula?`<div class="d-sec">计算方法</div><div class="d-text">${i.formula}</div>`:''}
    <div class="d-sec">目标值 / 阈值</div><div class="d-text">${i.threshold||'—'}</div>
    <div class="d-sec">依据</div><div class="d-text">${i.basedOn||'—'}</div>`;
  el.querySelectorAll('[data-goto]').forEach(x=>x.onclick=()=>focusOn(x.dataset.goto));
}

function renderOverviewDetail(){
  const el=document.getElementById('detail'), c=D.meta.counts;
  el.innerHTML=`
    <div class="d-bar" style="--nv:var(--d-core)"></div>
    <div class="d-top"><div class="d-title">本体总览</div>
      <span class="d-tag" style="--nv:var(--d-core);--nv-s:var(--d-core-s)">全图</span></div>
    <div class="d-en">urban-renewal-ontology</div>
    <dl class="kv">
      <dt>类</dt><dd>${c.classesTotal}（顶层 ${c.topClasses}）</dd>
      <dt>属性</dt><dd>${c.objectProps} 对象 / ${c.datatypeProps} 数据</dd>
      <dt>个体</dt><dd>${c.individuals}</dd>
      <dt>指标</dt><dd>${c.indicators}</dd>
    </dl>
    <div class="d-sec">16 个顶层类（点击聚焦）</div>
    <div class="chips">${TOP.map(x=>
      `<span class="chip" data-goto="${x.id}" style="border-color:var(--d-${x.domain});color:var(--d-${x.domain})">${x.cn}</span>`).join('')}</div>
    <div class="d-sec">怎么用</div>
    <div class="d-text">· 点任一节点 → 聚焦并缩放，右侧出详情<br>
      · 滚轮缩放 ／ 拖空白平移 ／ 拖节点微调布局<br>
      · 点 <b>overall 总览</b> 回到全局<br>
      · 顶部「显示 ABox 个体」可叠加 92 个个体</div>`;
  el.querySelectorAll('[data-goto]').forEach(x=>x.onclick=()=>focusOn(x.dataset.goto));
}

/* ===== 全量图谱：总览 / 点击聚焦缩放 / overall 回位 ===== */
const svg=document.getElementById('graph'), NS='http://www.w3.org/2000/svg';
const VW=1400, VH=1000, CX=VW/2, CY=VH/2, ANCH_R=430, K_MIN=.30, K_MAX=5;
const ANCH={};
DOM_ORDER.forEach((d,i)=>{
  const a=-Math.PI/2+i*2*Math.PI/DOM_ORDER.length;
  ANCH[d]={x:CX+Math.cos(a)*ANCH_R, y:CY+Math.sin(a)*ANCH_R};
});
let NODES=[], EDGES=[], IX={}, world=null, SEL=null, SHOW_ABOX=false, BUILT=false;
const view={k:1,tx:0,ty:0};
/* 实时力学模拟（D3 式拖拽联动） */
let DRAGGING=null, simRAF=null, simAlpha=0;
const PULLED=new Set();
/* ===== 单一视图：按需展开 / 图例过滤（四视角已合并，2026-11-22） ===== */
const EXPANDED=new Set();             // 已点开展开子类的顶层类 id
let FILTER_DOM=null;                  // 图例点选的域（null=全部）
const SUPPORT_IDS=new Set(D.classes.filter(c=>c.role==='support'||c.role==='technical').map(c=>c.id));
// 支撑类视角的"对端业务类"：与支撑类有对象属性相连的业务类，随支撑一起显示，
// 否则属性边因业务端不可见而画不出，看不到"支撑类如何挂进主干"
const SUPPORT_PEERS=new Set();
D.properties.filter(p=>p.type==='object').forEach(p=>{
  const a=(p.domain||[])[0], b=(p.range||[])[0];
  if(SUPPORT_IDS.has(a)&&b&&!SUPPORT_IDS.has(b)) SUPPORT_PEERS.add(b);
  if(SUPPORT_IDS.has(b)&&a&&!SUPPORT_IDS.has(a)) SUPPORT_PEERS.add(a);
});
function isVisible(n){
  // 单一视图：图例域过滤仍生效（支撑类归 neutral 域，点其他域时一并过滤）
  if(FILTER_DOM && n.dom!==FILTER_DOM) return false;
  // 按需展开：顶层类常显；支撑类/技术构件与其业务对端常显；子类仅当祖先顶层类已展开
  if(n.kind==='class' && n.top) return true;
  if(SUPPORT_IDS.has(n.id) || SUPPORT_PEERS.has(n.id)) return true;
  // 个体：ABox 打开时，所属顶层类已展开 → 显示；挂在支撑类下的个体（无顶层祖先）也直接显示
  if(SHOW_ABOX && n.kind==='inst')
    return EXPANDED.has(n.ancestorTop) || SUPPORT_IDS.has(n.ancestorTop);
  if(n.kind==='class') return EXPANDED.has(n.ancestorTop);
  return true;
}

function depthOf(id){ let d=0,c=CL[id]; while(c&&c.parent){d++;c=CL[c.parent];} return d; }
function ancestorTopOf(id){
  let c=CL[id],guard=0;
  while(c&&guard++<14){ if(c.role==='top') return c.id; c=c.parent?CL[c.parent]:null; }
  return id;
}
function nbOf(id){
  const s=new Set([id]);
  EDGES.forEach(e=>{ if(e.a===id) s.add(e.b); if(e.b===id) s.add(e.a); });
  return s;
}

/* ---------- 建图 ---------- */
function buildAll(){
  svg.innerHTML='';
  NODES=[]; EDGES=[]; IX={};
  const add=o=>{ if(IX[o.id]) return; o.vx=0; o.vy=0; NODES.push(o); IX[o.id]=o; };
  D.classes.forEach(c=>{
    const r = c.role==='top' ? 38 : (c.children.length ? 20 : 16);   // 增大以容纳圆内文字
    add({id:c.id, kind:'class', cn:c.cn, dom:c.domain||domOf(c.id), r,
         top:c.role==='top', parent:c.parent||null, depth:depthOf(c.id), ancestorTop:ancestorTopOf(c.id),
         decl:c.declared!==false, role:c.role});
  });
  D.classes.forEach(c=>{ if(c.parent&&IX[c.parent]) EDGES.push({a:c.parent, b:c.id, k:'sub', label:'subClassOf'}); });
  D.backbone.forEach(b=>{ if(IX[b.from]&&IX[b.to])
    EDGES.push({a:b.from, b:b.to, k:(b.pred==='triggers'?'dash':'core'), label:b.cn||b.pred}); });
  // 对象属性边：domain 类 → range 类（47 条）。多定义域/值域在 ttl 里已包成 Union_* 类，
  // 数据层为单端点，故每条属性直接成一边；两端不必同时可见（可见性由 renderAll 按视口判定）
  const drawn=new Set(EDGES.filter(e=>e.k==='core'||e.k==='dash').map(e=>e.a+'>'+e.b));
  D.properties.filter(p=>p.type==='object').forEach(p=>{
    const a=(p.domain||[])[0], b=(p.range||[])[0];
    if(a&&b&&a!==b&&IX[a]&&IX[b]&&!drawn.has(a+'>'+b)){
      EDGES.push({a, b, k:'prop', label:p.cn||p.id, pred:p.id});
      drawn.add(a+'>'+b);   // 同端点属性也去重，避免 label 叠字
    }
  });
  if(SHOW_ABOX){
    D.individuals.forEach(i=>{
      add({id:i.id, kind:'inst', cn:i.cn, dom:DMAP[i.cls]||'neutral', r:9, inst:true, depth:3,
           ancestorTop:ancestorTopOf(i.cls)});
      EDGES.push({a:i.cls, b:i.id, k:'inst'});
    });
  }
  // 初始撒点：域内顶层类沿扇区独立锚点均匀分布（Neo4j 式铺开，避免同域堆叠）
  // 主干 6 类例外：沿一条横向链弧铺开，让 5 条 backbone 关系线清晰可见
  const BB_ORDER=['ExaminationActivity','AssessmentResult','Problem','RemediationSuggestion','RenewalProject','IndicatorJudgement'];
  const perDom={}, perParent={};
  // 第一轮：顶层类
  NODES.filter(n=>n.top).forEach(n=>{
    const a=ANCH[n.dom]||{x:CX,y:CY};
    if(n.dom==='core'&&BB_ORDER.indexOf(n.id)>=0){
      const i=BB_ORDER.indexOf(n.id);
      n.home={x:CX+(i-2.5)*172, y:CY-250+Math.abs(i-2.5)*16};  // 横向弧链，关系线清晰
    }else{
      const i=perDom[n.dom]=(perDom[n.dom]||0); perDom[n.dom]++;
      const ang=-Math.PI/2+i*2*Math.PI/7;
      const rad=165+ (i%2)*28;
      n.home={x:a.x+Math.cos(ang)*rad, y:a.y+Math.sin(ang)*rad};
    }
    n.x=n.home.x; n.y=n.home.y;
  });
  // 第二轮：子类围绕父节点分布（一跳展开时成卫星状，不再挤到域锚点）
  // 支撑类/技术构件与其业务对端：布局在画布下方专用带（分层陈列，与上方业务类分区）
  let supIdx=0;
  const SUP_N=48, SUP_COLS=12;
  NODES.filter(n=>!n.top).forEach(n=>{
    const par=n.parent&&IX[n.parent];
    if(SUPPORT_IDS.has(n.id)||SUPPORT_PEERS.has(n.id)){
      supIdx++;
      const row=Math.floor((supIdx-1)/SUP_COLS), col=(supIdx-1)%SUP_COLS;
      n.home={x:CX+(col-(SUP_COLS-1)/2)*88,
              y:VH-150+row*76};
    }else{
      const a=par&&par.home ? par.home : (ANCH[n.dom]||{x:CX,y:CY});
      const j=perParent[n.parent||n.dom]=(perParent[n.parent||n.dom]||0)+1;
      const ang=j*2.399963, rad=44+12*Math.sqrt(j);
      n.home={x:a.x+Math.cos(ang)*rad, y:a.y+Math.sin(ang)*rad};
    }
    n.x=n.home.x; n.y=n.home.y;
  });
}

/* ---------- 力导向松弛（域锚点引力 → 同域成簇） ---------- */
/* 单步力学。pull=true（拖拽中）：相连边锁定拖拽瞬间的长度、边力增强、
   锚点力减弱——邻居被弹簧拽着走，松手后恢复目标长度自然回弹 */
function step(pull){
  const CUT=240*240, ACT=NODES.filter(isVisible);
  // 斥力
  for(let i=0;i<ACT.length;i++){
    const a=ACT[i]; if(a.fix) continue;
    for(let j=i+1;j<ACT.length;j++){
      const b=ACT[j]; if(b.fix) continue;
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if(d2>CUT) continue;
      if(d2<1){ dx=(Math.random()-.5); dy=(Math.random()-.5); d2=1; }
      const d=Math.sqrt(d2), f=Math.min(1500/d2,2.2)/d;
      a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f;
    }
  }
  // 边力（弹簧）
  const eK=pull?0.13:0.035;
  for(let k=0;k<EDGES.length;k++){
    const e=EDGES[k], A=IX[e.a], B=IX[e.b];
    if(!A||!B||!isVisible(A)||!isVisible(B)) continue;
    let L = e.k==='inst'?26 : e.k==='core'?210 : e.k==='dash'?220 : e.k==='prop'?150 : ((A.top&&B.top)?175:(A.top||B.top)?110:52);
    if(pull&&DRAGGING&&e.grabL&&(e.a===DRAGGING.id||e.b===DRAGGING.id)) L=e.grabL;
    let dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||1;
    const f=(d-L)*eK, ux=dx/d, uy=dy/d;
    A.vx+=ux*f; A.vy+=uy*f; B.vx-=ux*f; B.vy-=uy*f;
  }
  // 锚点力 + 速度积分
  const hK=pull?0.006:0.035, damp=pull?0.80:0.74;
  for(let k=0;k<ACT.length;k++){
    const n=ACT[k], a=n.home||ANCH[n.dom]||{x:CX,y:CY};
    n.vx+=(a.x-n.x)*hK; n.vy+=(a.y-n.y)*hK;
    n.vx+=(CX-n.x)*0.0006;  n.vy+=(CY-n.y)*0.0006;
    if(n.fix){ n.vx=0; n.vy=0; continue; }
    n.vx*=damp; n.vy*=damp;
    n.x+=n.vx; n.y+=n.vy;
  }
}
function relax(iters){ for(let i=0;i<iters;i++) step(false); }

/* 持续模拟：拖拽时保持激活（alpha 不衰减），松手后指数衰减直至静止 */
function kick(alpha){
  simAlpha=Math.max(simAlpha, alpha||1);
  if(!simRAF) simRAF=requestAnimationFrame(simTick);
}
function simTick(){
  const pulling=!!DRAGGING;
  simAlpha*=pulling?0.997:0.945;
  if(pulling||simAlpha>0.035){
    step(pulling);
    drawEdges();
    simRAF=requestAnimationFrame(simTick);
  } else {
    simRAF=null; simAlpha=0; drawEdges();
  }
}
function layoutAsync(done){
  // 同步收敛（不依赖 rAF，保证首帧即为最终布局、可复现）
  relax(NODES.length>150 ? 340 : 420);
  renderAll();
  done&&done();
}

/* ---------- 渲染 ---------- */
function renderAll(){
  // 重建前停掉残留的模拟循环，避免旧帧操作已销毁的节点
  if(simRAF){ cancelAnimationFrame(simRAF); simRAF=null; }
  simAlpha=0; DRAGGING=null; PULLED.clear();
  svg.innerHTML='';
  // 箭头标记（renderAll 会清空 svg，故每次重建）
  const defs=document.createElementNS(NS,'defs');
  [['ga','#7d93a8',.62],['ga-core','#5aa3e8',.95]].forEach(([id,col,op])=>{
    const m=document.createElementNS(NS,'marker');
    m.setAttribute('id',id); m.setAttribute('viewBox','0 0 10 10');
    m.setAttribute('refX','9'); m.setAttribute('refY','5');
    m.setAttribute('markerWidth','4.5'); m.setAttribute('markerHeight','4.5');
    m.setAttribute('orient','auto-start-reverse');
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d','M0 0 L10 5 L0 10 z');
    p.setAttribute('fill',col); p.setAttribute('opacity',op);
    m.appendChild(p); defs.appendChild(m);
  });
  svg.appendChild(defs);
  world=document.createElementNS(NS,'g'); svg.appendChild(world);
  const layerE=document.createElementNS(NS,'g');   // 边
  const layerN=document.createElementNS(NS,'g');   // 节点
  const layerL=document.createElementNS(NS,'g');   // 标签（永远在最上）
  world.appendChild(layerE); world.appendChild(layerN); world.appendChild(layerL);
  EDGES.forEach(e=>{
    const A=IX[e.a],B=IX[e.b];
    if(!A||!B||!isVisible(A)||!isVisible(B)){ e.el=null; e.el2=null; return; }
    const p=document.createElementNS(NS,'path');
    p.setAttribute('class','edge '+e.k);
    if(e.k!=='inst') p.setAttribute('marker-end','url(#'+(e.k==='core'?'ga-core':'ga')+')');
    e.el=p; layerE.appendChild(p);
    if(e.k!=='inst'&&e.label){
      const t=document.createElementNS(NS,'text');
      t.setAttribute('class','elabel'+(e.k==='core'?' core':'')+(e.k==='prop'?' prop':''));
      t.textContent=e.label; e.el2=t; layerE.appendChild(t);
    } else e.el2=null;
  });
  NODES.filter(isVisible).forEach(n=>{
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','gnode g-'+n.dom+(n.top?' top':'')+(n.inst?' inst':'')
      +(!n.decl?' undecl':'')+(n.role==='technical'?' tech':''));
    const c=document.createElementNS(NS,'circle'); c.setAttribute('r',n.r); g.appendChild(c);
    const ti=document.createElementNS(NS,'title');
    ti.textContent = n.cn+'  '+n.id; g.appendChild(ti);
    layerN.appendChild(g); n.el=g;
    const t=document.createElementNS(NS,'text');
    t.setAttribute('class','nlabel'+(n.top?' top':'')+(n.inst?' inst':''));
    // 文字统一白色（不设内联 fill，交由 .nlabel CSS 控制）
    t.textContent = n.cn.length>5 ? n.cn.slice(0,4)+'…' : n.cn;   // 圆内文字：短名截断
    // 字号按字数与圆直径自适应：字宽 ≤ 圆内直径 1.5r，绝不溢出
    const L=t.textContent.length;
    const fs=Math.max(6, Math.min(n.top?16:13, (n.r*1.55)/L));
    t.style.setProperty('--lfs', fs.toFixed(1));
    layerL.appendChild(t); n.t1=t;
    g.addEventListener('click', ev=>{
      ev.stopPropagation();
      if(n._dragMoved){ n._dragMoved=false; return; }   // 拖拽过则不触发点选/展开
      pickNode(n);
    });
    dragNode(n);
  });
  drawEdges(); updateScaleVar(); applyView();
}
function drawEdges(){
  NODES.forEach(n=>{
    if(n.el) n.el.setAttribute('transform',`translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`);
    if(n.t1) n.t1.setAttribute('transform',`translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`);
  });
  EDGES.forEach(e=>{
    const A=IX[e.a], B=IX[e.b]; if(!A||!B||!e.el) return;
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    // 箭头落在目标节点边缘（终点回退 r+3），避免被圆盖住
    let dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||1;
    const ex=B.x-dx/d*(B.r+4), ey=B.y-dy/d*(B.r+4);
    e.el.setAttribute('d',`M${A.x} ${A.y} Q ${mx} ${my} ${ex} ${ey}`);
    if(e.el2){
      let ang=Math.atan2(dy,dx)*180/Math.PI;
      if(ang>90||ang<-90) ang+=180;          // 文字不倒置
      e.el2.setAttribute('transform',`translate(${mx.toFixed(1)} ${my.toFixed(1)}) rotate(${ang.toFixed(1)})`);
      e.el2.setAttribute('dy',(-5/view.k).toFixed(1));
    }
  });
}
function applyView(){
  if(!world) return;
  // 用 CSS transform（而非 SVG transform 属性），这样能吃到 #world 的过渡，动画更丝滑
  world.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.k})`;
  svg.style.setProperty('--zk', view.k);
  updateLabels();
}
/* 屏幕比例：SVG 用户单位 → 屏幕 px 的系数（供字号/描边反算，保证屏幕字号恒定） */
let SS=1, SEARCH='';
function updateScaleVar(){
  const r=svg.getBoundingClientRect();
  if(!r.width) return;
  SS=Math.min(r.width/VW, r.height/VH);
  svg.style.setProperty('--ss', SS);
}
window.addEventListener('resize', ()=>{ updateScaleVar(); if(world) applyView(); });
function baseFs(n){ return n.top ? 15.5 : (n.inst ? 12 : 13.5); }   // 屏幕 px
/* 中文为全角、西文约 0.56 em，据此估宽（用于防重叠） */
function textW(s, fsV){
  let u=0;
  for(const ch of s) u += /[\u2e80-\u9fff\uff00-\uffef]/.test(ch) ? 1.0 : 0.56;
  return u*fsV;
}
function updateLabels(){
  const k=view.k, set=SEL ? nbOf(SEL) : null, pad=4/SS;
  // 边标签分级显示：主干关系常显，subClassOf 只在明显放大时显（避免满屏小字）
  EDGES.forEach(e=>{
    if(!e.el2) return;
    const on = e.k==='core' ? k>=0.75 : e.k==='dash' ? k>=1.0 : e.k==='prop' ? k>=2.0 : k>=3.2;
    e.el2.style.display = on ? '' : 'none';
  });
  const cand=[];
  NODES.forEach(n=>{
    if(!n.el) return;
    let show;
    if(n.inst)      show = k>=1.7;
    else if(n.top)  show = true;
    else            show = k>=1.55;
    if(set)         show = set.has(n.id);
    if(SEARCH)      show = (n.cn+n.id).toLowerCase().includes(SEARCH);
    if(!show){ n.t1.style.display='none'; return; }
    // 文字居中于圆内：y=0，包围盒按圆内区域计算
    n.t1.setAttribute('y', 0);
    n.t1.setAttribute('dy', parseFloat(n.t1.style.getPropertyValue('--lfs'))*0.02);  // 基线微补偿
    const fsV=(parseFloat(n.t1.style.getPropertyValue('--lfs'))||12);
    const sx=view.tx+n.x*k, sy=view.ty+n.y*k;    // 节点在 viewBox 中的位置
    const w=textW(n.t1.textContent, fsV);
    const by=sy;                                 // dominant-baseline:central ⇒ 圆中心
    const prio=(n.top?2:0)+(SEARCH?1:0)+((SEL&&n.id===SEL)?8:0)+((set&&set.has(n.id))?4:0);
    cand.push({n,prio, x0:sx-w/2-pad, x1:sx+w/2+pad, y0:by-fsV*0.62, y1:by+fsV*0.62});
  });
  cand.sort((a,b)=>b.prio-a.prio);
  const placed=[];
  cand.forEach(c=>{
    const hit=placed.some(p=>!(c.x1<p.x0||c.x0>p.x1||c.y1<p.y0||c.y0>p.y1));
    if(hit) c.n.t1.style.display='none';
    else { placed.push(c); c.n.t1.style.display=''; }
  });
}
function applyFocus(){
  const set = SEL ? nbOf(SEL) : null;
  NODES.forEach(n=>{
    if(!n.el) return;
    n.el.classList.toggle('spot', n.id===SEL);
    n.el.classList.toggle('faded', !!set && !set.has(n.id));
  });
  EDGES.forEach(e=>{
    if(!e.el) return;                       // 隐藏边无 DOM 节点（视角/展开/过滤所致）
    const on = !set || e.a===SEL || e.b===SEL;
    e.el.classList.toggle('faded', !on);
    e.el.classList.toggle('hot', !!SEL && (e.a===SEL || e.b===SEL));
  });
  const crumb=document.getElementById('crumb');
  if(SEL && IX[SEL]) crumb.innerHTML =
    `聚焦 <b>${IX[SEL].cn}</b> <span style="opacity:.5">·</span> 邻居 ${nbOf(SEL).size-1} 个`+
    ` <span style="opacity:.55">（点 overall 返回总览）</span>`;
  else crumb.innerHTML =
    `总览 <b>${NODES.filter(isVisible).length}</b> 个可见节点 <span style="opacity:.55">· 点顶层类展开子类 · 点节点聚焦 · 滚轮缩放 / 拖拽平移</span>`;
  updateLabels();
}
function zoomBy(f){
  const u={x:CX, y:CY};
  if(!world) return;
  const w={x:(u.x-view.tx)/view.k, y:(u.y-view.ty)/view.k};
  const nk=Math.max(K_MIN, Math.min(K_MAX, view.k*f));
  view.k=nk; view.tx=u.x-w.x*nk; view.ty=u.y-w.y*nk;
  applyView();
}

/* ---------- 视图动画 ---------- */
function animateView(t){
  // 交给 CSS 过渡平滑（#world 的 transform transition），比 rAF 插值更顺、且不受无头环境限制
  view.k=t.k; view.tx=t.tx; view.ty=t.ty; applyView();
}

/* ---------- 交互：聚焦 / 回总览 / 缩放 / 平移 / 拖拽 ---------- */
function spotlight(id){
  SEL=id;
  const n=IX[id]; if(!n){ applyFocus(); return; }
  const k=Math.max(1.55, Math.min(K_MAX, view.k<1.6?1.75:view.k));
  animateView({k, tx:CX-n.x*k, ty:CY-n.y*k});
  applyFocus();
  ripple(n);
}
/* 点击聚焦时：原点与其 1 跳邻居按「到原点的距离」依次颤动，形成涟漪扩散感 */
function ripple(origin){
  if(!origin || !world) return;
  const set=nbOf(origin.id);
  NODES.forEach(n=>{ if(n.el){ n.el.classList.remove('pop'); n.el.style.animationDelay=''; } });
  void world.getBoundingClientRect();          // 强制重排，保证动画可重启动
  NODES.forEach(n=>{
    if(!n.el || !set.has(n.id)) return;
    const d=Math.hypot(n.x-origin.x, n.y-origin.y);
    n.el.style.animationDelay=Math.min(d*1.1, 320).toFixed(0)+'ms';
    n.el.classList.add('pop');
  });
  clearTimeout(ripple._t);
  ripple._t=setTimeout(()=>NODES.forEach(n=>{
    if(n.el){ n.el.classList.remove('pop'); n.el.style.animationDelay=''; }
  }), 1500);
}
function fitView(){
  if(!NODES.length) return null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  NODES.forEach(n=>{ if(!n.el) return;
    x0=Math.min(x0,n.x-n.r-14); x1=Math.max(x1,n.x+n.r+14);
    y0=Math.min(y0,n.y-n.r-30); y1=Math.max(y1,n.y+n.r+6); });
  const w=Math.max(1,x1-x0), h=Math.max(1,y1-y0), pad=46;
  const k=Math.min((VW-2*pad)/w, (VH-2*pad)/h, 2.2);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  return {k, tx:CX-cx*k, ty:CY-cy*k};
}
function applyFit(instant){
  const t=fitView(); if(!t) return;
  if(instant && world){
    world.classList.add('nofx');
    view.k=t.k; view.tx=t.tx; view.ty=t.ty; applyView();
    setTimeout(()=>{ if(world) world.classList.remove('nofx'); }, 60);
  } else animateView(t);
}
function overall(instant){ SEL=null; applyFit(instant); applyFocus(); }
/* Neo4j 按需展开：点顶层类切换其子类可见性，重建布局但保持视角 */
function rebuildKeepView(){
  buildAll(); layoutAsync(); applyFocus();
  renderLegend();
}
function toggleExpand(id){
  if(EXPANDED.has(id)) EXPANDED.delete(id); else EXPANDED.add(id);
  rebuildKeepView();
}
function pickNode(n){
  if(n.top){ toggleExpand(n.id); focusOn(n.id); return; }
  if(n.inst){
    SEL=n.id; applyFocus();
    const m=/^Indicator_(\d+)$/.exec(n.id);
    if(m) showIndicator(+m[1]); else if(CL[n.cls]) renderDetail(n.cls);
    return;
  }
  focusOn(n.id);
}
function toUser(cx,cy){
  const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function toWorld(cx,cy){
  const u=toUser(cx,cy);
  return {x:(u.x-view.tx)/view.k, y:(u.y-view.ty)/view.k};
}
svg.addEventListener('wheel', ev=>{
  ev.preventDefault();
  const u=toUser(ev.clientX, ev.clientY);
  const w={x:(u.x-view.tx)/view.k, y:(u.y-view.ty)/view.k};
  const nk=Math.max(K_MIN, Math.min(K_MAX, view.k*(ev.deltaY<0 ? 1.13 : 0.885)));
  view.k=nk;
  view.tx=u.x-w.x*nk;
  view.ty=u.y-w.y*nk;
  applyView();
},{passive:false});
let panning=false, panS=null;
svg.addEventListener('pointerdown', ev=>{
  if(ev.target.closest('.gnode')) return;
  const u=toUser(ev.clientX, ev.clientY);
  panning=true; panS={ux:u.x, uy:u.y, tx:view.tx, ty:view.ty};
  if(world) world.classList.add('nofx');        // 平移要跟手，禁用过渡
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', ev=>{
  if(!panning||!panS) return;
  const u=toUser(ev.clientX, ev.clientY);
  view.tx=panS.tx+(u.x-panS.ux);
  view.ty=panS.ty+(u.y-panS.uy);
  applyView();
});

function dragNode(n){
  let on=false, ox=0, oy=0, sx=0, sy=0, moved=0;
  n.el.addEventListener('pointerdown', ev=>{
    if(ev.button!==0) return;
    on=true; n.fix=true; DRAGGING=n; moved=0; n._dragMoved=false;
    sx=ev.clientX; sy=ev.clientY;
    const p=toWorld(ev.clientX, ev.clientY); ox=p.x-n.x; oy=p.y-n.y;
    try{ n.el.setPointerCapture(ev.pointerId); }catch(_){}
    ev.stopPropagation();
    // 锁定相连弹簧的"拖拽瞬间长度"——邻居因此跟着平移，而不是静止或被推开
    EDGES.forEach(e=>{
      if((e.a===n.id||e.b===n.id)&&IX[e.a]&&IX[e.b]){
        const A=IX[e.a], B=IX[e.b];
        e.grabL=Math.hypot(B.x-A.x, B.y-A.y);
      }
    });
    PULLED.clear();
    EDGES.forEach(e=>{
      if(e.a===n.id) PULLED.add(e.b);
      if(e.b===n.id) PULLED.add(e.a);
    });
    PULLED.forEach(id=>{ if(IX[id]&&IX[id].el) IX[id].el.classList.add('pulled'); });
    n.el.classList.add('dragging');
    if(world) world.classList.add('nofx');
    kick(1);
  });
  n.el.addEventListener('pointermove', ev=>{
    if(!on) return;
    moved=Math.max(moved, Math.hypot(ev.clientX-sx, ev.clientY-sy));
    const p=toWorld(ev.clientX, ev.clientY);
    n.x=p.x-ox; n.y=p.y-oy; n.vx=n.vy=0;
    drawEdges();                   // 被拖节点立即跟手，不等动画帧
    kick(1);                       // 邻居由持续模拟联动
  });
  const end=()=>{
    if(!on) return;
    n._dragMoved = moved>4;        // 超过4px 视为拖拽，抑制后续 click
    on=false; n.fix=false; DRAGGING=null;
    n.el.classList.remove('dragging');
    PULLED.forEach(id=>{ if(IX[id]&&IX[id].el) IX[id].el.classList.remove('pulled'); });
    PULLED.clear();
    EDGES.forEach(e=>{ e.grabL=null; });
    if(world) world.classList.remove('nofx');
    kick(.9);                      // 弹簧恢复目标长度，缓慢回弹至稳定
  };
  n.el.addEventListener('pointerup', end);
  n.el.addEventListener('pointercancel', end);
}

/* ---------- 检索联动 ---------- */
function applySearch(v){
  if(!world) return;
  SEARCH=(v||'').toLowerCase();
  if(!SEARCH){
    NODES.forEach(n=>{ if(n.el) n.el.classList.remove('hit','miss'); });
    EDGES.forEach(e=>{ if(e.el) e.el.classList.remove('faded'); });
    applyFocus(); return;
  }
  NODES.forEach(n=>{
    if(!n.el) return;
    const m=(n.cn+n.id).toLowerCase().includes(SEARCH);
    n.el.classList.toggle('hit', m);
    n.el.classList.toggle('miss', !m);
    n.el.classList.remove('faded');
  });
  EDGES.forEach(e=>{ if(e.el) e.el.classList.remove('faded'); });
  updateLabels();
}

/* ===== G3 智能诊断视图（2026-11-20）=====
   浏览器内执行"测值 ↔ 参考值四档"比较，数据来自 window.__DIAG__（由真实规则实例导出）。
   正向：值越高越好（落在"很好"档即优）；逆向：值越低越好（超过上界即"不足"）。 */
function judgeGrade(val, rule){
  if(!rule || !rule.bands || !rule.bands.length) return null;
  const bands = rule.bands.slice().sort((a,b)=> (a.lo===-1? -1e18 : (a.lo===null? -1e18 : a.lo)) - (b.lo===-1? -1e18 : (b.lo===null? -1e18 : b.lo)));
  for(const b of bands){
    const lo = (b.lo===null || b.lo===undefined) ? -Infinity : b.lo;
    const hi = (b.hi===null || b.hi===undefined) ?  Infinity : b.hi;
    if(val>=lo && val<hi) return b.label;
  }
  return bands[bands.length-1].label;   // 超出上界落最低档
}
function gradeClass(label){
  if(label==='很好') return 'good';
  if(label==='较好' || label==='一般') return 'mid';
  return 'bad';
}
function renderDiagnosis(){
  const root=document.getElementById('dg');
  const DG=window.__DIAG__;
  if(!DG){ root.innerHTML='<div class="empty">诊断数据未加载：请确认 data/diagnosis.js 存在<br>（先运行 06-实例数据/端到端实证/_export_diagnosis_data.py）</div>'; return; }
  const vals=DG.values||{}, rules=DG.rules||{}, chains=DG.chains||{}, ratios=DG.ratios||{};
  const ids=Object.keys(vals).sort((a,b)=>Number(a)-Number(b));
  let cards='', nBad=0;
  ids.forEach(id=>{
    const v=vals[id], rule=rules[id];
    // ⚠️ 量纲对齐：占比化指标的档位是百分比，必须用派生占比判断，不能拿原始栋数直接比。
    // 无占比口径者（社区级12/15/16/17/18）只展示实测值，不强行判级。
    const hasRatio = Object.prototype.hasOwnProperty.call(ratios,id);
    const g = hasRatio ? judgeGrade(ratios[id],rule) : null;
    const cls = hasRatio ? gradeClass(g) : '';
    if(cls==='bad') nBad++;
    const meta=D.indicators ? D.indicators.find(x=>String(x.seq)===id) : null;
    const name=meta? meta.name : ('指标 '+id);
    const chained=!!chains[id];
    const mlabel=rule ? (rule.method||'').replace('EvaluationMethod_','') : '无规则';
    const vtext=hasRatio ? `实测 ${v} → ${ratios[id]}%（本社区${DG.denominator||'—'}栋）· ${mlabel}`
                         : `实测 ${v} ${meta&&meta.unit?meta.unit:''} · 占比口径待补`;
    // 分位读法（D3）：有同级分位数据的指标，第四行显示"同级分位"为主读法
    let pctHtml='';
    const P=DG.percentile;
    if(P && String(P.indicator)===String(id)){
      const rankTxt=`${P.rank}/${P.total}`;
      const barW=Math.max(3,Math.round(P.percentile||0));
      pctHtml=`<div class="pct">同级分位 <b>第${rankTxt}</b>（前${P.percentile}%较优）<span class="bar"><i style="width:${barW}%"></i></span></div>`;
    }
    cards+=`<div class="dg-card ${cls}" data-ind="${id}" title="点击查看该指标详情">
      <div class="t"><b>${name}</b><em>#${id}</em></div>
      <div class="v">${vtext}</div>
      <div class="g">${hasRatio?(g||'无档位'):'未判级'}${chained?' · 已派生问题链':''}</div>
      ${pctHtml}</div>`;
  });
  let chainHtml='';
  Object.keys(chains).sort((a,b)=>Number(a)-Number(b)).forEach(id=>{
    const c=chains[id];
    chainHtml+=`<div class="dg-chain">
      <div class="stem">Indicator_${id} → Problem → RemediationSuggestion → RenewalProject → RenewalObject</div>
      <div class="steps">
        <span class="step">指标#${id}</span><span class="ar">→</span>
        <span class="step p">${c.problem}</span><span class="ar">→</span>
        <span class="step">${c.suggestion}</span><span class="ar">→</span>
        <span class="step r">${c.project}</span><span class="ar">→</span>
        <span class="step">${c.object}</span>
      </div></div>`;
  });
  root.innerHTML=`<div class="dg-head">
      <h3>智能诊断 · 社区 ${DG.community||''}</h3>
      <span class="dg-badge">${ids.length} 项测值 · ${Object.keys(ratios).length} 项可判级 · ${nBad} 项不足 · ${Object.keys(chains).length} 条闭环链</span>
      <p>输入测值 → 按真实评价规则判等级 → 派生问题 → 整治建议 → 更新项目</p>
    </div>
    <div class="dg-grid">${cards}</div>
    <div class="dg-sec"><h4>已派生的闭环链</h4>${chainHtml||'<div class="empty">当前无派生链</div>'}</div>
    <div class="dg-note">说明：档位来自本体中 36 条评价规则实例（18 项公开标准 + 18 项样本市自评表【地方实操·不得当标准依据】）；
      测值为脱敏后社区级与小区级聚合值；判定在浏览器本地执行，逻辑与 SPARQL 实证一致。点击指标卡可在右侧看本体详情。</div>`;
  root.querySelectorAll('.dg-card').forEach(el=>{
    el.onclick=()=>{ const id=el.dataset.ind; showIndicator(id); };
  });
}
